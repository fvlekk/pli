name: pli
description: "Pli : tes courriers administratifs, compris et rappelés."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^6.10.0
  file_picker: ^13.1.0
  file_picker_web: ^4.2.0
  firebase_app_check: ^0.4.9
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/polices/baloo2-400.ttf
        - asset: assets/polices/baloo2-500.ttf
          weight: 500
        - asset: assets/polices/baloo2-600.ttf
          weight: 600
        - asset: assets/polices/baloo2-700.ttf
          weight: 700
        - asset: assets/polices/baloo2-800.ttf
          weight: 800
